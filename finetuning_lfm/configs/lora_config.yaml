
# QLoRA Configuration
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"] # Target all linear layers for max adaptation

# Training Arguments
batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2e-4
num_train_epochs: 20
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
max_seq_length: 2048
fp16: true
logging_steps: 10
save_strategy: "epoch"
optim: "adamw_torch"

# Model ID
model_id: "LiquidAI/LFM2-VL-450M"
